concurrency:
  cancel-in-progress: true
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
defaults:
  run:
    shell: pwsh
env:
  BUILD_CONFIGURATION: Release
  SOLUTION_FILE_PATH: ./SDI.slnx
jobs:
  VS2026-Build:
    continue-on-error: false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
         submodules: false
      - name: Initialize submodules
        run: |
          git submodule update --init ext/libwebp ext/libtorrent
          git submodule update --init ext/boost
      - name: Initialize required Boost libraries
        run: |
          cd ext/boost
          # Core libraries required by libtorrent
          $libs = @(
            'libs/config', 'libs/headers', 'libs/assert', 'libs/core',
            'libs/asio', 'libs/optional', 'libs/variant', 'libs/multiprecision',
            'libs/logic', 'libs/range', 'libs/utility', 'libs/smart_ptr', 'libs/date_time',
            'libs/functional', 'libs/pool', 'libs/multi_index', 'libs/intrusive', 'libs/predef',
            # Dependencies of above
            'libs/throw_exception', 'libs/static_assert', 'libs/type_traits', 'libs/mpl',
            'libs/preprocessor', 'libs/move', 'libs/winapi', 'libs/iterator', 'libs/tuple',
            'libs/bind', 'libs/io', 'libs/numeric/conversion', 'libs/integer', 'libs/detail',
            'libs/array', 'libs/container_hash', 'libs/describe', 'libs/mp11', 'libs/align',
            'libs/typeof', 'libs/function', 'libs/concept_check', 'libs/conversion',
            'libs/regex', 'libs/tokenizer', 'libs/lexical_cast', 'libs/container',
            'libs/exception', 'libs/algorithm'
          )
          git submodule update --init $libs
      - name: Generate Boost headers
        run: |
          # cd ext/boost
          .\bootstrap.bat
          .\b2 headers
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
          vs-prerelease: true
      - id: set_version
        name: Set version
        run: |
          .\Version.cmd (ALPHA)
      - name: Build
        run: |
          msbuild ${{ env.SOLUTION_FILE_PATH }} /m /p:Configuration=${{ env.BUILD_CONFIGURATION }},Platform=${{ matrix.TARGET_PLATFORM }},ForceImportBeforeCppTargets=%GITHUB_WORKSPACE%\.vs\Generate.PDB.props
      - continue-on-error: false
        if: ${{ github.event_name == 'push' }}
        name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.TARGET_PLATFORM }}
          path: |
            ./*.exe
            ./*.pdb
    strategy:
      matrix:
        TARGET_PLATFORM:
          - x64
          # - x86
name: VS2026
on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - .gitignore
      - res/**
      - '**.cmd'
      - '**.md'
      - '**.rc'
      - '**.txt'
  push:
    branches:
      - dev
    paths-ignore:
      - .github/ISSUE_TEMPLATE/**
      - .gitignore
      - res/**
      - '**.cmd'
      - '**.md'
      - '**.rc'
      - '**.txt'
